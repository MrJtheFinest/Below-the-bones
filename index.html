<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Below the Bones</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090d;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:monospace;color:#ddd6c4}
#wrap{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#09090d}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
button{font:inherit;color:#ddd6c4;background:#111116;border:2px solid #777;touch-action:none}
#arrowPad{display:none;position:absolute;left:14px;bottom:16px;width:160px;height:132px;z-index:10}
.arrow{position:absolute;width:52px;height:42px;border:2px solid #8a8a8f;border-radius:6px;background:#111116ee;color:#ddd6c4;font-size:23px;line-height:34px;padding:0;font-weight:bold}
#up{left:54px;top:0}.left{left:0;top:45px}.right{right:0;top:45px}.down{left:54px;bottom:0}
.arrow:active{background:#2a2a31}
#interact{z-index:30;display:none;position:absolute;right:18px;bottom:28px;width:78px;height:78px;border:3px solid #777;border-radius:50%;font-size:20px;z-index:5}
#combatButtons{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:none;gap:5px;width:min(94vw,360px);justify-content:center;z-index:12;flex-wrap:wrap}
.action{width:82px;height:43px;font-size:10px;font-weight:bold;border-radius:5px}
.action.sel{border-color:#eee;background:#202026}
#titleButtons{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:12px;width:min(230px,70vw);z-index:7}
#titleButtons button{height:50px;font-size:14px;border-radius:5px}
#titleButtons button{height:42px}
#toast{position:absolute;left:50%;top:7px;transform:translateX(-50%);font-size:9px;z-index:8;pointer-events:none;white-space:nowrap}
@media (min-width:700px){
 #arrowPad{left:5vw;bottom:5vh}
 #interact{right:5vw;bottom:6vh}
}
#msg{position:absolute;left:50%;bottom:178px;transform:translateX(-50%);width:88%;text-align:center;z-index:20;font-size:12px;pointer-events:none}</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="320" height="180"></canvas>
<div id="toast"></div>

<div id="arrowPad">
 <button class="arrow" id="up">▲</button>
 <button class="arrow left" id="left">◀</button>
 <button class="arrow right" id="right">▶</button>
 <button class="arrow down" id="down">▼</button>
</div>
<button id="interact">E</button>

<div id="combatButtons">
 <button class="action sel" data-action="fight">FIGHT</button>
 <button class="action" data-action="act">ACT</button>
 <button class="action" data-action="capture">CAPTURE</button>
 <button class="action" data-action="mercy">MERCY</button>
</div>

<div id="titleButtons">
 <button id="newGame">NEW GAME</button>
 <button id="continueGame">CONTINUE</button>
</div>
</div>

<script>
"use strict";

/* =========================================================
   BELOW THE BONES — CORE PROTOTYPE v0.5
   Data-driven, mobile-first, GitHub Pages compatible.
   ========================================================= */

const W=320,H=180;
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const UI={
 arrowPad:document.getElementById("arrowPad"),
  interact:document.getElementById("interact"),
 combat:document.getElementById("combatButtons"),
 title:document.getElementById("titleButtons"),
 continueBtn:document.getElementById("continueGame"),
 toast:document.getElementById("toast")
};

/* ---------- Enemy data ---------- */
const ENEMIES={
 coelophysis:{
  id:"coelophysis",
  name:"COELOPHYSIS",
  species:"Coelophysis",
  variant:"Scout",
  maxHp:32,
  baseDamage:1,
  captureAt:16,
  attackPattern:"scatter",
  actOptions:["OBSERVE","CALM"],
  dialogue:[
   "The small theropod watches your hands.",
   "It keeps one foot ready to run.",
   "Its eyes flick toward the cave entrance."
  ]
 }
};

/* ---------- Persistent game state ---------- */
const defaultState=()=>({
 version:1,
 scene:"title",
 room:"bone_chamber",
 player:{x:160,y:116,hp:20,maxHp:20},
 karma:0,
 kills:0,
 spared:0,
 captured:0,
 speciesEncountered:{},
 speciesExtinct:{},
 storyFlags:{introSeen:false},
 saved:false
});

let game=defaultState();

function loadGame(){
 try{
  const raw=localStorage.getItem("belowTheBonesSave");
  if(!raw) return false;
  const data=JSON.parse(raw);
  game=Object.assign(defaultState(),data);
  game.player=Object.assign(defaultState().player,data.player||{});
  game.speciesEncountered=data.speciesEncountered||{};
  game.speciesExtinct=data.speciesExtinct||{};
  game.storyFlags=data.storyFlags||{};
  return true;
 }catch(err){
  console.warn("Save load failed:",err);
  game=defaultState();
  return false;
 }
}

function saveGame(){
 try{
  game.saved=true;
  localStorage.setItem("belowTheBonesSave",JSON.stringify(game));
  showToast("MEMORY FOSSIL: JOURNEY RECORDED");
 }catch(err){
  showToast("THE FOSSIL CANNOT HOLD YOUR MEMORY.");
 }
}

/* ---------- Runtime state ---------- */
let battle=null;
let selectedAction="fight";
let message="";
let messageTimer=0;
let introStep=0;
let move={x:0,y:0};
let interactHeld=false;
let interactLatch=false;
let actionPointerReady=true;
let keys={left:false,right:false,up:false,down:false};
let last=performance.now();

/* ---------- Utilities ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
function say(t,seconds=3){message=t;messageTimer=seconds}
function showToast(t){
 UI.toast.textContent=t;
 clearTimeout(showToast.timer);
 showToast.timer=setTimeout(()=>UI.toast.textContent="",1800);
}
function route(){
 if(game.kills>=10 && game.kills>game.spared+game.captured) return "genocide";
 if(game.spared>=10 && game.kills===0) return "pacifist";
 return "neutral";
}

/* ---------- Input ---------- */
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowleft","a"].includes(k)) keys.left=true;
 if(["arrowright","d"].includes(k)) keys.right=true;
 if(["arrowup","w"].includes(k)) keys.up=true;
 if(["arrowdown","s"].includes(k)) keys.down=true;
 if(k==="e"||k===" "){e.preventDefault();interactHeld=true}
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(["arrowleft","a"].includes(k)) keys.left=false;
 if(["arrowright","d"].includes(k)) keys.right=false;
 if(["arrowup","w"].includes(k)) keys.up=false;
 if(["arrowdown","s"].includes(k)) keys.down=false;
 if(k==="e"||k===" ") interactHeld=false;
});

function setMoveButton(key, value){
  keys[key]=value;
}
["up","down","left","right"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    setMoveButton(id,true);
  });
  const release=e=>{
    e.preventDefault();
    setMoveButton(id,false);
  };
  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("lostpointercapture",()=>setMoveButton(id,false));
});

UI.interact.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(interactLatch) return;
 interactHeld=true;
 interactLatch=true;
 doInteract();
});

function releaseInteract(e){
 if(e) e.preventDefault();
 interactHeld=false;
 interactLatch=false;
}
UI.interact.addEventListener("pointerup",releaseInteract);
UI.interact.addEventListener("pointercancel",releaseInteract);

document.querySelectorAll(".action").forEach(btn=>{
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(!actionPointerReady || !battle) return;
  actionPointerReady=false;

  if(battle.phase==="attack"){
    if(btn.dataset.action==="fight") confirmAttack();
    return;
  }

  if(battle.phase==="actResult"){
    // A separate tap on ACT is required after the result is displayed.
    if(btn.dataset.action==="act") startEnemyAttack();
    return;
  }

  if(battle.phase!=="menu") return;
  selectedAction=btn.dataset.action;
  updateActionButtons();
  chooseAction(selectedAction);
 });

 const releaseAction=()=>{ actionPointerReady=true; };
 btn.addEventListener("pointerup",releaseAction);
 btn.addEventListener("pointercancel",releaseAction);
 btn.addEventListener("lostpointercapture",releaseAction);
});

function updateActionButtons(){
 document.querySelectorAll(".action").forEach(b=>{
   b.classList.toggle("sel",b.dataset.action===selectedAction);
   b.style.opacity=(battle && battle.phase==="attack" && b.dataset.action!=="fight")?"0.45":"1";
 });
}

/* ---------- Title / intro ---------- */
document.getElementById("newGame").addEventListener("pointerdown",e=>{
 e.preventDefault();
 game=defaultState();
 game.scene="intro";
 introStep=0;
 battle=null;
 interactHeld=false;
 interactLatch=false;
 keys={left:false,right:false,up:false,down:false};
 UI.title.style.display="none";
 hideAllControls();
 startIntro();
});

UI.continueBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(loadGame()){
  game.scene="room";
  battle=null;
  interactHeld=false;
  interactLatch=false;
  keys={left:false,right:false,up:false,down:false};
  UI.title.style.display="none";
  hideAllControls();
  showExploreControls();
  say("The memory returns.",3);
 }
});

function showTitle(){
 UI.title.style.display="flex";
 try {
  UI.continueBtn.style.display=localStorage.getItem("belowTheBonesSave")?"block":"none";
} catch(err) {
  UI.continueBtn.style.display="none";
}
 UI.arrowPad.style.display="none";
 UI.interact.style.display="none";
 UI.combat.style.display="none";
}

function startIntro(){
 UI.arrowPad.style.display="none";
 UI.combat.style.display="none";
 UI.interact.style.display="block";
 say("You wake beneath the bones.",3);
 game.storyFlags.introSeen=true;
}

function finishIntro(){
 game.scene="room";
 introStep=0;
 showExploreControls();
 say("Something moves in the chamber.",3);
}

/* ---------- Exploration ---------- */
const fossil={x:260,y:55};
const dinoSpawn={x:160,y:80};

function updateExploration(dt){
 let mx=(keys.right?1:0)-(keys.left?1:0);
 let my=(keys.down?1:0)-(keys.up?1:0);
 const len=Math.hypot(mx,my);
 if(len){
  game.player.x=clamp(game.player.x+mx/len*70*dt,15,305);
  game.player.y=clamp(game.player.y+my/len*70*dt,38,138);
 }
 // Keyboard/touch-hold fallback: pointer input triggers directly on pointerdown.
 // The latch guarantees one interaction per press.
 if(interactHeld && !interactLatch){
  interactLatch=true;
  doInteract();
 }
 if(!interactHeld) interactLatch=false;
}

function doInteract(){
 if(game.scene==="title") return;
 if(game.scene==="intro"){
  introStep++;
  if(introStep>=1) finishIntro();
  else startIntro();
  return;
 }
 if(game.scene==="battleResult"){
  battle=null;
  game.scene="room";
  showExploreControls();
  say("The cave grows quiet.",2);
  return;
 }
 if(game.scene!=="room") return;

 const pd=dist(game.player.x,game.player.y,dinoSpawn.x,dinoSpawn.y);
 const pf=dist(game.player.x,game.player.y,fossil.x,fossil.y);

 if(pf<20){
  saveGame();
 }else if(pd<26){
  beginBattle("coelophysis");
 }else{
  say("Nothing happens.",1.5);
 }
}

/* ---------- Combat ---------- */
function beginBattle(enemyId){
 const e=ENEMIES[enemyId];
 game.speciesEncountered[e.species]=(game.speciesEncountered[e.species]||0)+1;
 battle={
  enemyId,
  enemy:e,
  hp:e.maxHp,
  phase:"menu",
  timer:0,
  actStep:0,
  attackCursor:110,
  attackDir:1,
  attackSpeed:155,
  heart:{x:160,y:135},
  bullets:[],
  attackSeed:0,
  damageCooldown:0
 };
 game.scene="battle";
 actionPointerReady=true;
 syncCombatControls();
 selectedAction="fight";
 updateActionButtons();
 say(`${e.name} approaches.`,2.5);
}

function endBattle(result){
 const species=battle.enemy.species;
 battle.result=result;
 battle.phase="result";
 UI.combat.style.display="none";
 UI.interact.style.display="block";
 if(result==="kill"){
  game.kills++;
  game.karma--;
  game.speciesExtinct[species]=(game.speciesExtinct[species]||0)+1;
  say(`${species} is gone. The chamber feels larger.`,3);
 }else if(result==="spare"){
  game.spared++;
  game.karma++;
  say(`You leave ${species} alive. It retreats into the dark.`,3);
 }else if(result==="capture"){
  game.captured++;
  game.karma++;
  say(`${species} is captured without being killed.`,3);
 }
 game.scene="battleResult";
 hideExploreControls();
 UI.interact.style.display="block";
 saveSilent();
}

function saveSilent(){
 try{localStorage.setItem("belowTheBonesSave",JSON.stringify(game))}catch(e){}
}

function chooseAction(action){
 if(!battle || battle.phase!=="menu") return;

 if(action==="fight"){
  battle.phase="attack";
  battle.timer=0;
  battle.attackCursor=110;
  battle.attackDir=1;
  say("TIME YOUR STRIKE — TAP FIGHT",2);
 }

 if(action==="act"){
  battle.actStep++;
  const dialogueIndex=Math.min(battle.actStep-1,battle.enemy.dialogue.length-1);
  battle.lastAct=battle.enemy.dialogue[dialogueIndex];
  battle.phase="actResult";
  battle.timer=0;
  say(battle.lastAct,2.2);
 }

 if(action==="capture"){
  if(battle.hp<=battle.enemy.captureAt && battle.actStep>=1){
   endBattle("capture");
  }else{
   say("It is not calm enough to capture.",2);
   startEnemyAttack();
  }
 }

 if(action==="mercy"){
  if(battle.actStep>=2){
   endBattle("spare");
  }else{
   say("It does not trust you yet.",2);
   startEnemyAttack();
  }
 }
}

function confirmAttack(){
 if(!battle || battle.phase!=="attack") return;
 const center=160;
 const distance=Math.abs(battle.attackCursor-center);
 const quality=clamp(1-distance/50,0,1);
 const base=10;
 const damage=Math.max(1,Math.round(base*(0.55+quality*0.85)*(1+Math.min(game.kills,10)*0.02)));
 battle.hp=clamp(battle.hp-damage,0,battle.enemy.maxHp);
 const grade=quality>.88?"PERFECT":quality>.62?"GREAT":quality>.32?"OK":"WEAK";
 if(battle.hp<=0){
   say(`${grade} HIT! ${damage} DAMAGE`,2);
   setTimeout(()=>endBattle("kill"),650);
   battle.phase="resultWait";
   return;
 }
 say(`${grade} HIT! ${damage} DAMAGE`,1.5);
 startEnemyAttack();
}

function startEnemyAttack(){
 battle.phase="dodge";
 actionPointerReady=true;
 syncCombatControls();
 battle.timer=0;
 battle.attackSeed++;
 battle.bullets=[];
 battle.damageCooldown=0;

 const count=6+Math.min(4,game.kills);
 for(let i=0;i<count;i++){
  const side=i%2===0?-1:1;
  const targetY=103+(i%6)*7;
  battle.bullets.push({
   x:side<0?105:215,
   y:targetY,
   vx:side<0?(45+i*4):-(45+i*4),
   vy:Math.sin(i*1.7)*8
  });
 }
}

function updateBattle(dt){
 if(!battle)return;

 if(battle.phase==="actResult"){
   // Wait for the player to acknowledge the ACT result.
   // No automatic transition: ACT must be tapped again to dodge.
   return;
 }

 if(battle.phase==="attack"){
   battle.attackCursor += battle.attackDir*battle.attackSpeed*dt;
   if(battle.attackCursor>=210){battle.attackCursor=210;battle.attackDir=-1}
   if(battle.attackCursor<=110){battle.attackCursor=110;battle.attackDir=1}
   return;
 }

 if(battle.phase==="dodge"){
  let mx=(keys.right?1:0)-(keys.left?1:0);
  let my=(keys.down?1:0)-(keys.up?1:0);
  const len=Math.hypot(mx,my);
  if(len){
   battle.heart.x=clamp(battle.heart.x+mx/len*105*dt,112,208);
   battle.heart.y=clamp(battle.heart.y+my/len*105*dt,98,145);
  }

  battle.timer+=dt;
  battle.damageCooldown=Math.max(0,battle.damageCooldown-dt);

  for(const b of battle.bullets){
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<95||b.x>225){b.vx*=-1}
   if(dist(b.x,b.y,battle.heart.x,battle.heart.y)<6 && battle.damageCooldown<=0){
    const damage=Math.max(0,Number(battle.enemy.baseDamage)||0);
    game.player.hp=Math.max(0,game.player.hp-damage);
    battle.damageCooldown=.45;
    say(`The attack hits you for ${damage}.`,.7);
   }
  }

  if(game.player.hp<=0){
   game.player.hp=game.player.maxHp;
   battle.phase="menu";
   say("You collapse, then wake beside the Memory Fossil.",3);
   game.scene="room";
   battle=null;
   hideAllControls();
   UI.interact.style.display="block";
   return;
  }

  if(battle.timer>=3.8){
   battle.phase="menu";
   actionPointerReady=true;
   syncCombatControls();
   battle.bullets=[];
   say("The dinosaur waits.",1.5);
  }
 }
}

/* ---------- Rendering ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(s,x,y,size=8,align="left"){
 ctx.font=`${size}px monospace`;
 ctx.textAlign=align;
 ctx.fillStyle="#ddd6c4";
 ctx.fillText(s,x,y);
}

function draw(){
 rect(0,0,W,H,"#0b0b0f");

 if(game.scene==="title") drawTitle();
 else if(game.scene==="intro") drawIntro();
 else if(game.scene==="room") drawRoom();
 else if(game.scene==="battle") drawBattle();
 else if(game.scene==="battleResult") drawBattleResult();

 if(messageTimer>0 && game.scene!=="battleResult"){
  rect(8,145,304,27,"#111116");
  txt(message,14,157,7);
  txt("KARMA "+game.karma+"  KILLS "+game.kills+"  ROUTE "+route().toUpperCase(),14,168,6);
 }
}

function drawTitle(){
 rect(12,15,296,150,"#141419");
 txt("BELOW",160,54,22,"center");
 txt("THE BONES",160,79,22,"center");
 txt("A DINOSAUR RPG",160,96,7,"center");
 txt("80 creatures • 3 sections • 3 routes",160,108,6,"center");
 txt("v0.5 CORE PROTOTYPE",160,128,6,"center");
}

function drawIntro(){
 rect(10,15,300,130,"#17171d");
 txt("You are falling.",160,50,9,"center");
 txt("The sound of stone fades above you.",160,68,7,"center");
 txt("Bones surround the darkness.",160,82,7,"center");
 txt("Something alive breathes nearby.",160,96,7,"center");
 txt("TAP E TO CONTINUE",160,125,8,"center");
}

function drawRoom(){
 rect(8,23,304,122,"#25252c");

 /* rock pattern */
 for(let y=30;y<142;y+=12){
  for(let x=14;x<307;x+=18){
   if((x+y)%36<18)rect(x,y,5,2,"#303039");
  }
 }

 /* entrance */
 rect(140,23,40,7,"#08080b");

 /* fossil */
 rect(fossil.x-9,fossil.y-6,18,12,"#746b50");
 rect(fossil.x-4,fossil.y-3,8,6,"#c9bd88");
 txt("MEMORY FOSSIL",fossil.x,fossil.y-13,5,"center");

 /* dinosaur */
 rect(dinoSpawn.x-11,dinoSpawn.y-7,25,10,"#748078");
 rect(dinoSpawn.x+8,dinoSpawn.y-13,9,10,"#748078");
 rect(dinoSpawn.x-18,dinoSpawn.y-4,9,4,"#748078");
 rect(dinoSpawn.x-6,dinoSpawn.y+3,4,8,"#748078");
 rect(dinoSpawn.x+9,dinoSpawn.y+3,4,8,"#748078");
 rect(dinoSpawn.x+16,dinoSpawn.y-10,2,2,"#e0d6b7");

 /* player */
 rect(game.player.x-3,game.player.y-5,6,8,"#e5dac0");
 rect(game.player.x-2,game.player.y+3,4,3,"#8e684e");

 txt("BONE CHAMBER",14,16,9);
 txt("HP "+game.player.hp+"/"+game.player.maxHp,306,16,7,"right");
 txt("▲ ◀ ▶ ▼  MOVE     E  INTERACT",160,141,5,"center");
}

function drawBattle(){
 rect(8,23,304,122,"#111116");
 txt(battle.enemy.name,14,16,9);
 txt("HP "+battle.hp+"/"+battle.enemy.maxHp,306,16,7,"right");

 /* dinosaur silhouette */
 rect(130,48,58,16,"#78847c");
 rect(178,40,16,18,"#78847c");
 rect(120,54,15,5,"#78847c");
 rect(142,62,5,9,"#78847c");
 rect(176,62,5,9,"#78847c");
 rect(192,45,3,3,"#ddd6b7");

 ctx.strokeStyle="#aaa39a";
 ctx.lineWidth=1;
 ctx.strokeRect(108,92,104,57);

 if(battle.phase==="attack"){
  txt("TAP FIGHT WHEN THE LINE IS CENTERED",160,84,7,"center");
  rect(108,105,104,8,"#2b2b31");
  rect(154,102,12,14,"#45454d");
  rect(158,103,4,12,"#ddd6c4");
  rect(battle.attackCursor-2,102,4,14,"#ddd6c4");
  txt("WEAK       OK       GREAT       PERFECT",160,125,5,"center");
 }else if(battle.phase==="actResult"){
  txt("YOU OBSERVE THE DINOSAUR",160,82,7,"center");
  txt("ACT #"+battle.actStep,160,93,6,"center");
  const info=(battle.lastAct||"It watches you carefully.");
  const words=info.split(" ");
  let line="", lines=[];
  for(const word of words){
   const test=line?line+" "+word:word;
   if(test.length>38){ lines.push(line); line=word; }
   else line=test;
  }
  if(line) lines.push(line);
  lines.slice(0,3).forEach((ln,i)=>txt(ln,160,105+i*9,6,"center"));
  txt("RELEASE ACT, THEN TAP ACT TO DODGE",160,135,5,"center");
 }else if(battle.phase==="dodge"){
  for(const b of battle.bullets)rect(b.x-2,b.y-2,4,4,"#d5cdbb");
  rect(battle.heart.x-3,battle.heart.y-3,6,6,"#f0e5c9");
  txt("DODGE — MOVE THE HEART",160,85,7,"center");
 }else{
  txt("CHOOSE YOUR ACTION",160,89,7,"center");
  txt(message||"FIGHT / ACT / CAPTURE / MERCY",160,104,6,"center");
 }
}

function drawBattleResult(){
 rect(10,18,300,145,"#15151b");
 txt("ENCOUNTER COMPLETE",160,32,10,"center");
 txt(battle?.enemy?.name||"DINOSAUR",160,49,9,"center");
 if(battle){
   const e=battle.enemy;
   txt(e.species+" • "+e.variant,160,63,6,"center");
   txt("HP: "+e.maxHp+"   ATTACK: "+e.baseDamage,160,76,6,"center");
   txt("PATTERN: "+e.attackPattern.toUpperCase(),160,87,6,"center");
   txt("ACT: "+e.actOptions.join(" / "),160,98,6,"center");
 }
 txt("KARMA "+game.karma+"   KILLS "+game.kills+"   SPARED "+game.spared,160,114,6,"center");
 txt("ROUTE: "+route().toUpperCase(),160,125,7,"center");
 txt("TAP E TO CONTINUE",160,145,8,"center");
}

/* ---------- Main loop ---------- */
function update(dt){
 messageTimer=Math.max(0,messageTimer-dt);

 if(game.scene==="intro"){
  /* Intro is tap-driven; no continuous movement needed. */
 }else if(game.scene==="room"){
  updateExploration(dt);
 }else if(game.scene==="battle"){
  updateBattle(dt);
 }
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000);
 last=now;
 update(dt);
 syncCombatControls();
 draw();
 requestAnimationFrame(loop);
}

/* ---------- Control visibility ---------- */
function showExploreControls(){
 UI.arrowPad.style.display="block";
 UI.interact.style.display="block";
}
function hideExploreControls(){
 UI.arrowPad.style.display="none";
 UI.interact.style.display="none";
}
function hideAllControls(){
 UI.arrowPad.style.display="none";
 UI.interact.style.display="none";
 UI.combat.style.display="none";
}

function syncCombatControls(){
  if(game.scene!=="battle" || !battle){
    UI.combat.style.display="none";
    // Exploration owns the arrows/E button; intro/title manage themselves.
    if(game.scene==="room"){
      UI.arrowPad.style.display="block";
      UI.interact.style.display="block";
    }else if(game.scene!=="intro" && game.scene!=="title" && game.scene!=="battleResult"){
      UI.arrowPad.style.display="none";
    }
    return;
  }

  // Action menu and dodge arena use different touch controls.
  if(battle.phase==="dodge"){
    UI.combat.style.display="none";
    UI.arrowPad.style.display="block";
    UI.interact.style.display="none";
  }else{
    UI.combat.style.display="flex";
    UI.arrowPad.style.display="none";
    UI.interact.style.display="none";
  }
}

/* ---------- Boot ---------- */
function boot(){
  // Always show the title first. Gameplay controls are enabled by startIntro().
  try { showTitle(); } catch(err) { console.error("Boot error:", err); }
  requestAnimationFrame(loop);
}
if(document.readyState==="loading") window.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
